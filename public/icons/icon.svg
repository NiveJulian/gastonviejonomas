<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo redondeado estilo app móvil con gradiente oscuro -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Resplandor central -->
  <circle cx="256" cy="256" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Emblema de billetera y destello inteligente GASTONAPP -->
  <g transform="translate(106, 116)">
    <!-- Silueta geométrica de billetera/tarjeta inteligente -->
    <rect x="10" y="50" width="280" height="190" rx="36" fill="#1e293b" stroke="#4f46e5" stroke-width="8"/>
    <path d="M 10 110 L 290 110" stroke="#334155" stroke-width="8"/>
    <rect x="180" y="125" width="80" height="50" rx="16" fill="url(#goldEmerald)"/>
    <circle cx="205" cy="150" r="8" fill="#0f172a"/>

    <!-- Destello estelar IA -->
    <path d="M 230 10 Q 230 70 290 70 Q 230 70 230 130 Q 230 70 170 70 Q 230 70 230 10 Z" fill="url(#goldEmerald)" filter="url(#glow)"/>
  </g>

  <!-- Letra G sutil identificadora de GASTON -->
  <text x="256" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">GASTONAPP</text>
</svg>
